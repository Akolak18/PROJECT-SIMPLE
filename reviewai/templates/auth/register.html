{% extends "base.html" %}
{% block title %}Create account — ReplyFast AI{% endblock %}

{% block body %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 font-bold text-xl text-gray-900 mb-6">
        <span class="w-9 h-9 rounded-xl bg-green-500 flex items-center justify-center text-white font-black">R</span>
        ReplyFast AI
      </a>
      <h1 class="text-3xl font-bold text-gray-900">Create your account</h1>
      <p class="text-gray-500 mt-2">Free plan, no credit card required</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form method="POST" action="/auth/register" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Full name</label>
          <input type="text" name="full_name" value="{{ full_name or '' }}" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
            placeholder="Jane Smith" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Work email</label>
          <input type="email" name="email" value="{{ email or '' }}" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
            placeholder="jane@mybusiness.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input type="password" name="password" required minlength="8"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
            placeholder="At least 8 characters" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm password</label>
          <input type="password" name="confirm_password" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
            placeholder="••••••••" />
        </div>
        <button type="submit"
          class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition-colors text-sm">
          Create free account →
        </button>
        <p class="text-xs text-gray-400 text-center">
          By signing up you agree to our Terms of Service and Privacy Policy.
        </p>
      </form>
    </div>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a href="/auth/login" class="text-green-600 font-semibold hover:underline">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
