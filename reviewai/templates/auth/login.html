{% extends "base.html" %}
{% block title %}Sign in — ReplyFast AI{% endblock %}

{% block body %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 font-bold text-xl text-gray-900 mb-6">
        <span class="w-9 h-9 rounded-xl bg-green-500 flex items-center justify-center text-white font-black">R</span>
        ReplyFast AI
      </a>
      <h1 class="text-3xl font-bold text-gray-900">Welcome back</h1>
      <p class="text-gray-500 mt-2">Sign in to your account</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form method="POST" action="/auth/login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" name="email" value="{{ email or '' }}" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
            placeholder="you@business.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input type="password" name="password" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
            placeholder="••••••••" />
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
            <input type="checkbox" name="remember" class="rounded border-gray-300 text-green-500 focus:ring-green-400" />
            Remember me
          </label>
        </div>
        <button type="submit"
          class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition-colors text-sm">
          Sign in →
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-gray-500 mt-6">
      Don't have an account?
      <a href="/auth/register" class="text-green-600 font-semibold hover:underline">Start free</a>
    </p>
  </div>
</div>
{% endblock %}
